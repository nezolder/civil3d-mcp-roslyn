name: Claude plugin release

# A new version of the Claude connector plugin on main (packaging/claude-plugin/.claude-plugin/plugin.json)
# -> package it, refresh it in the shared plugin marketplace repository, publish a GitHub Release.
#
# In the marketplace only plugins/claude/nezolder-civil3d-mcp/ and this plugin's entry in
# .claude-plugin/marketplace.json change; the script refuses any other change there.
# The tag nezolder-civil3d-mcp-v<version> marks a version as released, so a version is never released twice.
#
# Needs the repository secret KIADAS_TOKEN: a fine-grained token for the marketplace repository only,
# with Contents: Read and write.
on:
  push:
    branches: [main]
    paths: [packaging/claude-plugin/.claude-plugin/plugin.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-plugin-release
  cancel-in-progress: false

env:
  PLUGIN: nezolder-civil3d-mcp
  MARKETPLACE_REPO: nezolder-ai/ai-pluginok

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Plugin version
        id: v
        run: echo "version=$(node scripts/package-claude-plugin.mjs --print-version)" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: tag
        env:
          TAG: ${{ env.PLUGIN }}-v${{ steps.v.outputs.version }}
        run: |
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG is already released; nothing to do."
            echo "done=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Packaging tests
        if: steps.tag.outputs.done != '1'
        run: |
          npm ci --ignore-scripts
          npm run test:packaging
      - name: Package and refresh the marketplace
        if: steps.tag.outputs.done != '1'
        env:
          KIADAS_TOKEN: ${{ secrets.KIADAS_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$KIADAS_TOKEN" ]; then
            echo "::error::The KIADAS_TOKEN secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          market="$RUNNER_TEMP/marketplace"
          # Another plugin's release may push in between: start again from a fresh clone, at most three times.
          for attempt in 1 2 3; do
            rm -rf "$market"
            git clone -q "https://x-access-token:${KIADAS_TOKEN}@github.com/${MARKETPLACE_REPO}.git" "$market"
            node scripts/package-claude-plugin.mjs --release --out "dist/claude-plugin/$PLUGIN" --marketplace "$market"
            cd "$market"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "The marketplace already holds this build."
              cd "$GITHUB_WORKSPACE"
              break
            fi
            git commit -q -m "$PLUGIN $VERSION (source ${GITHUB_SHA::7})"
            if git push -q origin HEAD; then
              cd "$GITHUB_WORKSPACE"
              break
            fi
            cd "$GITHUB_WORKSPACE"
            if [ "$attempt" = 3 ]; then
              echo "::error::The push to the marketplace was refused three times."
              exit 1
            fi
            sleep 10
          done
      - name: Plugin file
        if: steps.tag.outputs.done != '1'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cd "dist/claude-plugin/$PLUGIN"
          zip -X -r -q "../$PLUGIN-$VERSION.plugin" .
          cd ..
          sha256sum "$PLUGIN-$VERSION.plugin" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: GitHub Release
        if: steps.tag.outputs.done != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "$TAG" \
            "dist/claude-plugin/$PLUGIN-$VERSION.plugin" \
            dist/claude-plugin/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "$PLUGIN $VERSION (Claude plugin)" --latest=false \
            --notes "Claude connector plugin, built automatically from ${GITHUB_SHA::7}. It starts the MCP server installed on the PC (npm run install:server); it does not contain the server or the Civil 3D plugin."
